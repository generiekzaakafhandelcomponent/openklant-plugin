<v-paragraph [margin]="true" [italic]="true">
    {{ 'update-klantcontactDescription' | pluginTranslate: pluginId | async }}
</v-paragraph>
<v-form
    (valueChange)="formValueChange($event)"

        disabled: disabled$ | async,
        prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null

        name="uuid"
        [title]="'uuid' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"

        [disabled]="obs.disabled"
        [required]="true"
    >
    </v-input>

        name="kanaal"
        [title]="'kanaal' | pluginTranslate: pluginId | async"
