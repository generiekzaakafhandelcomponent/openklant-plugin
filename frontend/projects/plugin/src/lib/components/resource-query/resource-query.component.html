<v-paragraph [margin]="true" [italic]="true">
    {{ 'resource-queryDescription' | pluginTranslate: pluginId | async }}
</v-paragraph>
<v-form
    (valueChange)="formValueChange($event)"
    *ngIf="{
        disabled: disabled$ | async,
        prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null
    } as obs"
>
    <v-input
        name="resultPvName"
        [title]="'resultPvName' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.resultPvName"
        [disabled]="obs.disabled"
        [required]="true"
    >
    </v-input>

    <v-input
        name="queryParams"
        [title]="'queryParams' | pluginTranslate: pluginId | async"
        [tooltip]="'queryParamsTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.queryParams"
        [disabled]="obs.disabled"
        [required]="false"
    >
    </v-input>

</v-form>
