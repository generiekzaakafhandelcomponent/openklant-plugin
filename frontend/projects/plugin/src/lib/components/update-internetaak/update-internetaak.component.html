<v-paragraph [margin]="true" [italic]="true">
    {{ 'update-internetaakDescription' | pluginTranslate: pluginId | async }}
</v-paragraph>
<v-form
    (valueChange)="formValueChange($event)"
    *ngIf="{
        disabled: disabled$ | async,
        prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null
    } as obs"
>
    <v-input
        name="uuid"
        [title]="'uuid' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.uuid"
        [disabled]="obs.disabled"
        [required]="true"
    >
    </v-input>

    <v-input
        name="gevraagdeHandeling"
        [title]="'gevraagdeHandeling' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.gevraagdeHandeling"
        [disabled]="obs.disabled"
        [required]="false"
    >
    </v-input>

    <v-input
        name="klantcontactUuid"
        [title]="'klantcontactUuid' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.klantcontactUuid"
        [disabled]="obs.disabled"
        [required]="false"
    >
    </v-input>

    <v-input
        name="status"
        [title]="'status' | pluginTranslate: pluginId | async"
        [tooltip]="'statusTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.status"
        [disabled]="obs.disabled"
        [required]="false"
    >
    </v-input>

    <v-input
        name="nummer"
        [title]="'nummer' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.nummer"
        [disabled]="obs.disabled"
        [required]="false"
    >
    </v-input>

    <v-input
        name="referentienummer"
        [title]="'referentienummer' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.referentienummer"
        [disabled]="obs.disabled"
        [required]="false"
    >
    </v-input>

    <v-input
        name="toegewezenAanActoren"
        [title]="'toegewezenAanActoren' | pluginTranslate: pluginId | async"
        [tooltip]="'uuidListTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.toegewezenAanActoren"
        [disabled]="obs.disabled"
        [required]="false"
    >
    </v-input>

    <v-input
        name="toelichting"
        [title]="'toelichting' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.toelichting"
        [disabled]="obs.disabled"
        [required]="false"
    >
    </v-input>

    <v-input
        name="afgehandeldOp"
        [title]="'afgehandeldOp' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.afgehandeldOp"
        [disabled]="obs.disabled"
        [required]="false"
    >
    </v-input>

    <v-input
        name="resultPvName"
        [title]="'resultPvName' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.resultPvName"
        [disabled]="obs.disabled"
        [required]="true"
    >
    </v-input>

</v-form>
