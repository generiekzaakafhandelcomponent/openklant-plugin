<v-paragraph [margin]="true" [italic]="true">
    {{ 'create-rekeningnummerDescription' | pluginTranslate: pluginId | async }}
</v-paragraph>
<v-form
    (valueChange)="formValueChange($event)"
    *ngIf="{
        disabled: disabled$ | async,
        prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null
    } as obs"
>
    <v-input
        name="iban"
        [title]="'iban' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.iban"
        [disabled]="obs.disabled"
        [required]="true"
    >
    </v-input>

    <v-input
        name="partijUuid"
        [title]="'partijUuid' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.partijUuid"
        [disabled]="obs.disabled"
        [required]="false"
    >
    </v-input>

    <v-input
        name="bic"
        [title]="'bic' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.bic"
        [disabled]="obs.disabled"
        [required]="false"
    >
    </v-input>

    <v-input
        name="resultPvName"
        [title]="'resultPvName' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.resultPvName"
        [disabled]="obs.disabled"
        [required]="true"
    >
    </v-input>

</v-form>
