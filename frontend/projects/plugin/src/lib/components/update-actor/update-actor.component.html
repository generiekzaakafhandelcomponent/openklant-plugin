<v-paragraph [margin]="true" [italic]="true">
    {{ 'update-actorDescription' | pluginTranslate: pluginId | async }}
</v-paragraph>
<cds-inline-notification
    [notificationObj]="{
        type: 'warning',
        lowContrast: true,
        showClose: false,
        title: '',
        message: 'update-actorPatchWarning' | pluginTranslate: pluginId | async
    }"
></cds-inline-notification>
<v-form
    (valueChange)="formValueChange($event)"
    *ngIf="{
        disabled: disabled$ | async,
        prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null
    } as obs"
>
    <v-input
        name="uuid"
        [title]="'uuid' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.uuid"
        [disabled]="obs.disabled"
        [required]="true"
    >
    </v-input>

    <v-input
        name="naam"
        [title]="'naam' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.naam"
        [disabled]="obs.disabled"
        [required]="false"
    >
    </v-input>

    <v-input
        name="soortActor"
        [title]="'soortActor' | pluginTranslate: pluginId | async"
        [tooltip]="'soortActorTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.soortActor"
        [disabled]="obs.disabled"
        [required]="false"
