<v-paragraph [margin]="true" [italic]="true">
    {{ 'create-partij-identificatorDescription' | pluginTranslate: pluginId | async }}
</v-paragraph>
<v-form
    (valueChange)="formValueChange($event)"
    *ngIf="{
        disabled: disabled$ | async,
        prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null
    } as obs"
>
    <v-input
        name="objectId"
        [title]="'objectId' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.objectId"
        [disabled]="obs.disabled"
        [required]="true"
    >
    </v-input>

    <v-input
        name="codeObjecttype"
        [title]="'codeObjecttype' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.codeObjecttype"
        [disabled]="obs.disabled"
        [required]="true"
    >
    </v-input>

    <v-input
        name="codeRegister"
        [title]="'codeRegister' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.codeRegister"
        [disabled]="obs.disabled"
        [required]="true"
    >
    </v-input>

    <v-input
        name="codeSoortObjectId"
        [title]="'codeSoortObjectId' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.codeSoortObjectId"
        [disabled]="obs.disabled"
        [required]="true"
    >
    </v-input>

    <v-input
        name="partijUuid"
        [title]="'partijUuid' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.partijUuid"
        [disabled]="obs.disabled"
        [required]="false"
    >
    </v-input>

    <v-input
        name="subIdentificatorVanUuid"
        [title]="'subIdentificatorVanUuid' | pluginTranslate: pluginId | async"
        [tooltip]="'variableFieldTooltip' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.subIdentificatorVanUuid"
        [disabled]="obs.disabled"
        [required]="false"
    >
    </v-input>

    <v-input
        name="resultPvName"
        [title]="'resultPvName' | pluginTranslate: pluginId | async"
        [margin]="true"
        [defaultValue]="obs.prefill?.resultPvName"
        [disabled]="obs.disabled"
        [required]="true"
    >
    </v-input>

</v-form>
