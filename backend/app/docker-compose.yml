name: open-klant-plugin

# Shared image definitions. Anchors let services reuse a single image tag
# instead of repeating it; bump a version here to update every service using it.
x-images:
  postgres: &postgres-image postgres:17.4
  postgis: &postgis-image postgis/postgis:17-3.5
  redis: &redis-image redis:7.4.3
  rabbitmq: &rabbitmq-image rabbitmq:4.1.0-management
  keycloak: &keycloak-image quay.io/keycloak/keycloak:26.2.2
  busybox: &busybox-image busybox:1.37.0
  openzaak: &openzaak-image openzaak/open-zaak:1.25.0
  objects: &objects-image maykinmedia/objects-api:2.4.4
  objecttypes: &objecttypes-image maykinmedia/objecttypes-api:3.0.2
  open-notificaties: &open-notificaties-image openzaak/open-notificaties:1.8.2
  open-forms: &open-forms-image openformulieren/open-forms:3.1.6
  open-klant: &open-klant-image maykinmedia/open-klant:2.16.0

services:

  # Plugin sandbox database

  plugin-database:
    restart: unless-stopped
    image: *postgres-image
    ports:
      - "54320:5432"
    environment:
      POSTGRES_USER: plugin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: plugin
    volumes:
      - plugin-database-data:/var/lib/postgresql/data # persist data even if container shuts down
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ

  plugin-rabbitmq:
    restart: unless-stopped
    image: *rabbitmq-image
    volumes:
      - ./imports/plugin-rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./imports/plugin-rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    command: >
      bash -c "
        rabbitmq-plugins enable --offline rabbitmq_stream rabbitmq_stream_management &&
        rabbitmq-server
      "
    environment:
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq.conf

  # Keycloak

  plugin-keycloak:
    restart: unless-stopped
    depends_on:
      plugin-keycloak-database:
        condition: service_healthy
    image: *keycloak-image
    ports:
      - "8081:8080"
    command:
      - start-dev
      - --import-realm
      - --http-enabled=true
      - --hostname-strict=false
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://plugin-keycloak-database/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_FEATURES: token-exchange,admin-fine-grained-authz
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
    volumes:
      - ./imports/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: [ 'CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(((java.net.HttpURLConnection)new java.net.URL(args[0]).openConnection()).getResponseCode() == 200 ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:8080/auth' ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 5s

  plugin-keycloak-database:
    restart: unless-stopped
    image: *postgres-image
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenZaak

  openzaak-database:
    restart: unless-stopped
    profiles:
      - zgw
      - openzaak
    image: *postgis-image
    platform: linux/amd64
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: openzaak
      POSTGRES_PASSWORD: openzaak
      POSTGRES_DB: openzaak
    volumes:
      - ./imports/open-zaak:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  openzaak-redis:
    restart: unless-stopped
    profiles:
      - zgw
      - openzaak
    image: *redis-image
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 1s
      retries: 3

  openzaak-web:
    restart: unless-stopped
    profiles:
      - zgw
      - openzaak
    depends_on:
      openzaak-database:
        condition: service_healthy
      openzaak-redis:
        condition: service_healthy
    image: *openzaak-image
    platform: linux/amd64
    ports:
      - "8001:8000"
    environment:
      DB_HOST: openzaak-database
      DB_POST: 5433
      SECRET_KEY: 'veryRestrictedSecretKey'
      DB_USER: openzaak
      DB_PASSWORD: openzaak
      DB_NAME: openzaak
      CACHE_DEFAULT: openzaak-redis:6379/0
      CACHE_AXES: openzaak-redis:6379/0
      DEBUG: "true"
      ALLOWED_HOSTS: 'localhost,host.docker.internal,172.17.0.1,openzaak'
      OPENZAAK_SUPERUSER_USERNAME: admin
      OPENZAAK_SUPERUSER_EMAIL: admin@admin.org
      DJANGO_SUPERUSER_PASSWORD: admin
      SENDFILE_BACKEND: django_sendfile.backends.simple
      NOTIFICATIONS_DISABLED: "true"
      DISABLE_2FA: "true"
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; exit(requests.head('http://localhost:8000/admin/').status_code not in [200, 302])" ]
      interval: 30s
      timeout: 5s
      retries: 3
      # This should allow for enough time for migrations to run before the max
      # retries have passed. This healthcheck in turn allows other containers
      # to wait for the database migrations.
      start_period: 30s

  # Objecten

  objecten-api-database:
    restart: unless-stopped
    profiles:
      - zgw
      - objecten
    image: *postgis-image
    platform: linux/amd64
    ports:
      - "54321:5432"
    environment:
      POSTGRES_USER: objects
      POSTGRES_PASSWORD: objects
      POSTGRES_DB: objects
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  objecten-api-redis:
    restart: unless-stopped
    profiles:
      - zgw
      - objecten
    image: *redis-image
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 1s
      retries: 3

  objecten-api-web:
    restart: unless-stopped
    profiles:
      - zgw
      - objecten
    depends_on:
      objecten-api-database:
        condition: service_healthy
      objecten-api-redis:
        condition: service_healthy
    image: *objects-image
    platform: linux/amd64
    ports:
      - "8010:8000"
    environment: &objects_env
      DB_USER: objects
      DB_PASSWORD: objects
      DB_HOST: objecten-api-database
      DJANGO_SETTINGS_MODULE: objects.conf.docker
      SECRET_KEY: '${SECRET_KEY:-1(@f(-6s_u(5fd&1sg^uvu2s(c-9sapw)1era8q&)g)h@cwxxg}'
      IS_HTTPS: "no"
      ALLOWED_HOSTS: '*'
      CACHE_DEFAULT: objecten-api-redis:6379/0
      CACHE_AXES: objecten-api-redis:6379/0
      CELERY_BROKER_URL: redis://objecten-api-redis:6379/1
      CELERY_RESULT_BACKEND: redis://objecten-api-redis:6379/1
      CELERY_LOGLEVEL: DEBUG
      DISABLE_2FA: "true"
      OBJECTS_SUPERUSER_EMAIL: admin@example.org
      OBJECTS_SUPERUSER_USERNAME: admin
      OBJECTS_SUPERUSER_PASSWORD: admin
      DEBUG: "true"
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; exit(requests.head('http://localhost:8000/admin/').status_code not in [200, 302])" ]
      interval: 30s
      timeout: 5s
      retries: 3
      # This should allow for enough time for migrations to run before the max
      # retries have passed. This healthcheck in turn allows other containers
      # to wait for the database migrations.
      start_period: 30s

  objecten-api-import:
    profiles:
      - zgw
      - objecten
    depends_on:
      objecten-api-web:
        condition: service_healthy
    image: *objects-image
    platform: linux/amd64
    # in the current version of django it is not possible to create a new user with password without user interaction by using the createsuperuser command
    command: sh init/init.sh
    environment: *objects_env
    volumes:
      - ./imports/objects-api/fixtures:/app/src/objects/fixtures
      - ./imports/objects-api/init:/app/init

  objecten-api-celery:
    restart: unless-stopped
    profiles:
      - zgw
      - objecten
    depends_on:
      objecten-api-web:
        condition: service_healthy
    image: *objects-image
    command: /celery_worker.sh
    environment: *objects_env
    healthcheck:
      test: [ "CMD", "python", "/app/bin/check_celery_worker_liveness.py" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Objecttypen

  objecttypen-api-database:
    restart: unless-stopped
    profiles:
      - zgw
      - objecten
    image: *postgres-image
    ports:
      - "54324:5432"
    environment:
      POSTGRES_USER: objecttypes
      POSTGRES_PASSWORD: objecttypes
      POSTGRES_DB: objecttypes
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  objecttypen-api-web:
    restart: unless-stopped
    profiles:
      - zgw
      - objecten
    depends_on:
      objecttypen-api-database:
        condition: service_healthy
    image: *objecttypes-image
    platform: linux/amd64
    ports:
      - "8011:8000"
    environment: &objecttypes_env
      DB_HOST: objecttypen-api-database
      DB_USER: objecttypes
      DB_PASSWORD: objecttypes
      DJANGO_SETTINGS_MODULE: objecttypes.conf.docker
      SECRET_KEY: '${SECRET_KEY:-fgv=c0hz&tl*8*3m3893@m+1pstrvidc9e^5@fpspmg%cy$$15d}'
      ALLOWED_HOSTS: '*'
      CACHE_DEFAULT: objecten-api-redis:6379/0
      CACHE_AXES: objecten-api-redis:6379/0
      CELERY_BROKER_URL: redis://objecten-api-redis:6379/1
      CELERY_RESULT_BACKEND: redis://objecten-api-redis:6379/1
      CELERY_LOGLEVEL: DEBUG
      DISABLE_2FA: "true"
      OBJECTTYPE_SUPERUSER_EMAIL: admin@example.org
      OBJECTTYPE_SUPERUSER_USERNAME: admin
      OBJECTTYPE_SUPERUSER_PASSWORD: admin
      DEBUG: "true"
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; exit(requests.head('http://localhost:8000/admin/').status_code not in [200, 302])" ]
      interval: 30s
      timeout: 5s
      retries: 3
      # This should allow for enough time for migrations to run before the max
      # retries have passed. This healthcheck in turn allows other containers
      # to wait for the database migrations.
      start_period: 30s

  objecttypen-api-import:
    profiles:
      - zgw
      - objecten
    depends_on:
      objecttypen-api-web:
        condition: service_healthy
    image: *objecttypes-image
    platform: linux/amd64
    command: sh init/init.sh
    environment: *objecttypes_env
    volumes:
      - ./imports/objecttypes-api/fixtures:/app/src/objecttypes/fixtures
      - ./imports/objecttypes-api/init:/app/init

  # Open Notificaties

  open-notificaties-database:
    restart: unless-stopped
    profiles:
      - zgw
    image: *postgres-image
    ports:
      - "54319:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-notifications}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-notifications}
      POSTGRES_DB: notifications
    volumes:
      - ./imports/open-notificaties:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  open-notificaties-rabbitmq:
    restart: unless-stopped
    profiles:
      - zgw
    image: *rabbitmq-image
    ports:
      - "5673:5672"
      - "15673:15672"

  open-notificaties-web:
    restart: unless-stopped
    profiles:
      - zgw
    depends_on:
      open-notificaties-database:
        condition: service_healthy
      open-notificaties-rabbitmq:
        condition: service_started
    image: *open-notificaties-image
    platform: linux/amd64
    ports:
      - "8002:8000"
    environment: &notificaties_env
      DJANGO_SETTINGS_MODULE: nrc.conf.docker
      SECRET_KEY: '${SECRET_KEY:-4wHY2Cp5`4(q%)]cuWxPQJRp5kN?g+`.Xah>%6Fsq6+)R>p_}'
      ALLOWED_HOSTS: '*'
      CACHE_DEFAULT: open-notificaties-redis:6379/0
      CACHE_AXES: open-notificaties-redis:6379/1
      DB_PORT: 5432
      DB_HOST: open-notificaties-database
      DB_NAME: notifications
      DB_USER: notifications
      DB_PASSWORD: notifications
      DEBUG: "true"
      RABBITMQ_HOST: open-notificaties-rabbitmq
      PUBLISH_BROKER_URL: redis://open-notificaties-redis:6379/0
      CELERY_BROKER_URL: redis://open-notificaties-redis:6379/0
      CELERY_RESULT_BACKEND: redis://open-notificaties-redis:6379/0
      CELERY_LOGLEVEL: DEBUG
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
      SUBPATH: ${SUBPATH:-/}
      DISABLE_2FA: "true"

  open-notificaties-celery:
    restart: unless-stopped
    profiles:
      - zgw
    depends_on:
      open-notificaties-database:
        condition: service_healthy
      open-notificaties-rabbitmq:
        condition: service_started
      open-notificaties-redis:
        condition: service_healthy
    image: *open-notificaties-image
    platform: linux/amd64
    command: /celery_worker.sh
    environment: *notificaties_env

  open-notificaties-redis:
    restart: unless-stopped
    profiles:
      - zgw
    image: *redis-image
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 1s
      retries: 3

  # Open Formulieren

  open-forms-database:
    restart: unless-stopped
    profiles:
      - openformulieren
    image: *postgres-image
    ports:
      - "54322:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-openforms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openforms}
    volumes:
      - ./imports/open-formulieren:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  open-forms-redis:
    restart: unless-stopped
    profiles:
      - openformulieren
    image: *redis-image
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 1s
      retries: 3

  open-forms-web:
    restart: unless-stopped
    profiles:
      - openformulieren
    depends_on:
      open-forms-database:
        condition: service_healthy
      open-forms-redis:
        condition: service_healthy
    image: *open-forms-image
    platform: linux/amd64
    ports:
      - "8003:8000"
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    environment: &open-forms-web_env
      CORS_ALLOW_ALL_ORIGINS: "true"
      DJANGO_SETTINGS_MODULE: openforms.conf.docker
      SECRET_KEY: '${SECRET_KEY:-@r0w-0(&apjfde5fl6h23!vn)r1ldkp1c_d2#!$$did4z5hun4a}'
      DB_NAME: openforms
      DB_USER: openforms
      DB_PASSWORD: openforms
      DB_HOST: open-forms-database
      CACHE_DEFAULT: open-forms-redis:6379/0
      CACHE_AXES: open-forms-redis:6379/0
      CACHE_PORTALOCKER: open-forms-redis:6379/0
      ALLOWED_HOSTS: '*'
      CELERY_BROKER_URL: redis://open-forms-redis:6379/0
      CELERY_RESULT_BACKEND: redis://open-forms-redis:6379/0
      CELERY_LOGLEVEL: DEBUG
      OPENFORMS_LOCATION_CLIENT: ${OPENFORMS_LOCATION_CLIENT:-openforms.contrib.bag.client.BAGClient}
      # Needed for Celery Flower to match the TIME_ZONE configured in the
      # settings used by workers and beat containers.
      TZ: Europe/Amsterdam
      # otpauth://totp/admin?secret=7IG6WR32BFB3AAT6ZZ54RAC53QN27B2N&algorithm=SHA1&digits=6&period=30
      DEBUG: "true"
    volumes:
      - ./imports/open-formulieren/private_media:/app/private_media

  open-forms-celery:
    restart: unless-stopped
    profiles:
      - openformulieren
    depends_on:
      open-forms-database:
        condition: service_healthy
      open-forms-redis:
        condition: service_healthy
    image: *open-forms-image
    platform: linux/amd64
    command: /celery_worker.sh
    environment: *open-forms-web_env
    healthcheck:
      test: [ "CMD", "python", "/app/bin/check_celery_worker_liveness.py" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./imports/open-formulieren/private_media:/app/private_media

  open-forms-celery-beat:
    restart: unless-stopped
    profiles:
      - openformulieren
    depends_on:
      open-forms-database:
        condition: service_healthy
      open-forms-redis:
        condition: service_healthy
    image: *open-forms-image
    platform: linux/amd64
    command: /celery_beat.sh
    environment: *open-forms-web_env

  open-forms-celery-flower:
    restart: unless-stopped
    profiles:
      - openformulieren
    depends_on:
      open-forms-redis:
        condition: service_healthy
      open-forms-celery:
        condition: service_healthy
    image: *open-forms-image
    platform: linux/amd64
    ports:
      - "5555:5555"
    command: /celery_flower.sh
    environment: *open-forms-web_env

  open-forms-busybox:
    profiles:
      - openformulieren
    image: *busybox-image
    command: /bin/chown -R 1000 /private_media
    volumes:
      - ./imports/open-formulieren/private_media:/private_media

  # Open Klant

  open-klant-database:
    restart: unless-stopped
    image: *postgres-image
    ports:
      - "54323:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-openklant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openklant}
    volumes:
      - ./imports/open-klanten:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  open-klant-redis:
    restart: unless-stopped
    image: *redis-image
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 1s
      retries: 3

  open-klant-web:
    restart: unless-stopped
    depends_on:
      open-klant-database:
        condition: service_healthy
    image: *open-klant-image
    platform: linux/amd64
    ports:
      - "8006:8000"
    environment:
      DJANGO_SETTINGS_MODULE: openklant.conf.docker
      SECRET_KEY: '${SECRET_KEY:-django-insecure-$$8s@b*ds4t84-q_2#c0j0506@!l2q6r5_pq5e!vm^_9c*#^66b}'
      DB_NAME: openklant
      DB_USER: openklant
      DB_PASSWORD: openklant
      DB_HOST: open-klant-database
      CACHE_DEFAULT: open-klant-redis:6379/0
      CACHE_AXES: open-klant-redis:6379/0
      ALLOWED_HOSTS: '*'
      DISABLE_2FA: "true"

volumes:
  plugin-database-data:
